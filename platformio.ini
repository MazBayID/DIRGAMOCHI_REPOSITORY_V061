; Dirgamochi-C3 firmware
; Board: ESP32-C3 Super Mini
;
; If you ever see a boot loop after flashing:
;   1. Hold BOOT, tap RESET, release BOOT, then flash again (forces download mode).
;   2. Try a different USB cable/port - many "Super Mini" boards brown-out on
;      weak cables because the onboard regulator is small.
;   3. Erase flash fully once: `pio run -t erase` then reflash.
;   4. Make sure ENABLE_AUDIO stays 0 until the base firmware boots cleanly.

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Converts assets/faces/*.zip (PNG frames), assets/audio/mochi_voices.zip
; (IMA ADPCM voice clips) and assets/misc/sleep_logo.png into the PROGMEM
; sources the firmware compiles in, before every build. Needs Python +
; Pillow (auto-installed into PlatformIO's Python on first use). Same
; script CI runs explicitly - see .github/workflows/build.yml.
extra_scripts = pre:tools/generate_assets.py

; native USB-CDC (Super Mini has no separate USB-UART bridge chip)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

; conservative flash settings: works across most "Super Mini" clone boards
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
; no OTA needed yet -> huge_app gives ~3MB for the app, plenty of headroom
board_build.partitions = huge_app.csv

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.3
    fbiego/ESP32Time@^2.0.6
    h2zero/NimBLE-Arduino@^2.1.0
    ricmoo/QRCode ; renders the QR/link screen from data Chronos relays from the phone
; Preferences (NVS) used by the settings menu ships with the Arduino-ESP32
; core itself, so it needs no lib_deps entry.

; -------------------------------------------------------------------------
; Optional: flip this on (pio run -e esp32-c3-supermini-audio) once the base
; firmware above is confirmed stable, to build with I2S mic/speaker enabled.
; -------------------------------------------------------------------------
[env:esp32-c3-supermini-audio]
extends = env:esp32-c3-supermini
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D ENABLE_AUDIO=1
